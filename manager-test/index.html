<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Manager evaluation | Estimation Tools</title>
  <link rel="icon" href="../assets/hager-logo.png">
  <style>
    :root{color-scheme:light;--nav:#151a20;--brand:#009ee2;--brand2:#007eb5;--text:#17202a;--muted:#5b6876;--line:#d6dde5;--surface:#fff;--page:#eef2f6;}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:grid;grid-template-rows:56px 1fr}
    header{background:var(--nav);border-bottom:3px solid var(--brand);display:flex;align-items:center;padding:0 24px;color:#fff;gap:14px}
    header img{width:88px;height:auto;display:block}header span{font-size:14px;font-weight:700;border-left:1px solid #46515e;padding-left:14px}
    main{display:grid;place-items:center;padding:28px 18px}
    .access{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:32px;box-shadow:0 12px 34px rgba(22,31,41,.12)}
    .eyebrow{margin:0 0 8px;color:var(--brand2);font-size:11px;font-weight:800;text-transform:uppercase}
    h1{font-size:24px;line-height:1.2;margin:0 0 12px;letter-spacing:0}p{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 24px}
    button{width:100%;min-height:44px;border:0;border-radius:6px;background:var(--brand);color:#fff;font:700 14px Arial,Helvetica,sans-serif;cursor:pointer}
    button:hover{background:var(--brand2)}button:focus-visible{outline:3px solid rgba(0,158,226,.3);outline-offset:2px}button:disabled{cursor:wait;opacity:.66}
    #status{min-height:20px;margin:14px 0 0;font-size:12px;font-weight:700;color:#b42318}#status.ok{color:#087a49}
    .facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:22px;padding-top:18px;gap:16px}.facts strong{display:block;font-size:12px;margin-bottom:3px}.facts span{font-size:11px;color:var(--muted)}
    @media(max-width:520px){header{padding:0 16px}.access{padding:25px 20px}.facts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><img src="../assets/hager-logo.png" alt="Hager"><span>Estimation Tools</span></header>
  <main>
    <section class="access" aria-labelledby="title">
      <p class="eyebrow">Private evaluation</p>
      <h1 id="title">Manager test workspace</h1>
      <p>This single-use pass opens a temporary workspace containing synthetic electrical schedules. No customer documents or live project data are included.</p>
      <button id="start" type="button">Start test</button>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="facts" aria-label="Test details">
        <div><strong>Sample data</strong><span>Riverside office schedules</span></div>
        <div><strong>Storage</strong><span>Session only</span></div>
      </div>
    </section>
  </main>
  <script>
    (()=>{
      const ENDPOINT='https://ldhhuscifjxdgptneelb.supabase.co/functions/v1/manager-test-redeem';
      const SESSION_KEY='estimation-tools-manager-session-v1';
      const button=document.querySelector('#start'),status=document.querySelector('#status');
      let token=location.hash.replace(/^#(?:token=)?/,'').trim();
      history.replaceState(null,'',location.pathname+location.search);
      const show=(message,ok=false)=>{status.textContent=message;status.classList.toggle('ok',ok);};
      if(new URLSearchParams(location.search).get('expired')==='1')show('This test session has ended. Request a new pass.');
      if(!token){button.disabled=true;show('This pass is missing or has already been opened.');}
      button.addEventListener('click',async()=>{
        if(!token)return;
        button.disabled=true;button.textContent='Opening workspace...';show('');
        try{
          const response=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});
          token='';
          if(!response.ok){show(response.status===410?'This pass has expired or has already been used.':'The test workspace could not be opened.');button.textContent='Pass unavailable';return;}
          sessionStorage.setItem(SESSION_KEY,JSON.stringify({expiresAt:Date.now()+8*60*60*1000}));
          show('Pass accepted. Opening the sample project...',true);
          location.replace('../?manager-test=1');
        }catch(error){
          show('The test service is temporarily unavailable. Please try again.');button.disabled=false;button.textContent='Try again';
        }
      });
    })();
  </script>
</body>
</html>
