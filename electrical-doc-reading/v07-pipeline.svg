<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7078"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="27" font-weight="700" fill="#1a1a1c">V-07 · The five-phase pipeline</text>
  <text x="40" y="74" font-size="16" fill="#6e7078">Each phase consumes the previous phase's output. Collapsing 1–3 into 4 is the root cause of every defect in the trap catalogue.</text>

  <!-- phases -->
  <g>
    <!-- 1 -->
    <rect x="40" y="110" width="216" height="128" rx="10" fill="#f2f6fc" stroke="#155ca8" stroke-width="2"/>
    <circle cx="66" cy="136" r="14" fill="#155ca8"/><text x="66" y="141" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="88" y="141" font-size="17" font-weight="700" fill="#155ca8">ACQUIRE</text>
    <text x="56" y="170" font-size="14" fill="#1a1a1c">words with bounding boxes</text>
    <text x="56" y="192" font-size="13" fill="#6e7078">PyMuPDF get_text("words")</text>
    <text x="56" y="210" font-size="13" fill="#6e7078">+ get_drawings()</text>
    <text x="56" y="228" font-size="13" fill="#6e7078">no text layer → OCR</text>

    <!-- 2 -->
    <rect x="296" y="110" width="216" height="128" rx="10" fill="#f5f2fb" stroke="#6c3ca0" stroke-width="2"/>
    <circle cx="322" cy="136" r="14" fill="#6c3ca0"/><text x="322" y="141" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="344" y="141" font-size="17" font-weight="700" fill="#6c3ca0">RULE</text>
    <text x="312" y="170" font-size="14" fill="#1a1a1c">column + row bands</text>
    <text x="312" y="192" font-size="13" fill="#6e7078">ruling lines, else whitespace</text>
    <text x="312" y="210" font-size="13" fill="#6e7078">projection</text>
    <text x="312" y="228" font-size="13" fill="#6e7078">grouped + rotated headers</text>

    <!-- 3 -->
    <rect x="552" y="110" width="216" height="128" rx="10" fill="#f0f8f3" stroke="#1b7a3e" stroke-width="2"/>
    <circle cx="578" cy="136" r="14" fill="#1b7a3e"/><text x="578" y="141" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="600" y="141" font-size="17" font-weight="700" fill="#1b7a3e">BIND</text>
    <text x="568" y="170" font-size="14" fill="#1a1a1c">cell grid</text>
    <text x="568" y="192" font-size="13" fill="#6e7078">every word → one cell by</text>
    <text x="568" y="210" font-size="13" fill="#6e7078">x-overlap and y-overlap</text>
    <text x="568" y="228" font-size="13" fill="#6e7078">straddling → AMBIGUOUS</text>

    <!-- 4 -->
    <rect x="808" y="110" width="216" height="128" rx="10" fill="#fdf7ee" stroke="#b0700c" stroke-width="2"/>
    <circle cx="834" cy="136" r="14" fill="#b0700c"/><text x="834" y="141" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="856" y="141" font-size="17" font-weight="700" fill="#b0700c">INTERPRET</text>
    <text x="824" y="170" font-size="14" fill="#1a1a1c">domain fields</text>
    <text x="824" y="192" font-size="13" fill="#6e7078">field lexicon, device rules,</text>
    <text x="824" y="210" font-size="13" fill="#6e7078">per-document legends,</text>
    <text x="824" y="228" font-size="13" fill="#6e7078">scoped inheritance</text>

    <!-- 5 -->
    <rect x="1064" y="110" width="216" height="128" rx="10" fill="#f7f7f9" stroke="#4a4c54" stroke-width="2"/>
    <circle cx="1090" cy="136" r="14" fill="#4a4c54"/><text x="1090" y="141" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="1112" y="141" font-size="17" font-weight="700" fill="#4a4c54">RECONCILE</text>
    <text x="1080" y="170" font-size="14" fill="#1a1a1c">cross-check</text>
    <text x="1080" y="192" font-size="13" fill="#6e7078">schedule ⟷ schematic</text>
    <text x="1080" y="210" font-size="13" fill="#6e7078">coverage gate</text>
    <text x="1080" y="228" font-size="13" fill="#6e7078">flag, then emit</text>

    <line x1="258" y1="174" x2="292" y2="174" stroke="#6e7078" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="514" y1="174" x2="548" y2="174" stroke="#6e7078" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="770" y1="174" x2="804" y2="174" stroke="#6e7078" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="1026" y1="174" x2="1060" y2="174" stroke="#6e7078" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- the shortcut -->
  <path d="M148 244 C 148 296, 916 296, 916 250" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arR)"/>
  <rect x="470" y="348" width="432" height="34" rx="8" fill="#fdf4f4" stroke="#c62828" stroke-width="2"/>
  <text x="686" y="371" font-size="15" font-weight="700" fill="#c62828" text-anchor="middle">the shortcut that produces every defect in the catalogue</text>

  <!-- worked example -->
  <text x="40" y="416" font-size="20" font-weight="700" fill="#1a1a1c">Worked on one row — DB Schedules – Main house &amp; Flats, p.8, way 1</text>

  <g font-size="14">
    <rect x="40" y="412" width="1240" height="44" rx="8" fill="#f6f7fa" stroke="#d7d9e0"/>
    <text x="58" y="440" font-size="15" font-weight="700" fill="#1a1a1c">1 · L2 · 3PH · RADIAL · MCB/C · 32 · No · CONDENSER - CU-01 BASEMENT · 6mm²/ 5c XLPE/SWA/LSF BS6724 · Conductor + Armour</text>

    <rect x="40" y="470" width="1240" height="30" rx="6" fill="#eef4fb"/>
    <text x="58" y="490" fill="#155ca8" font-weight="700">1 · acquire</text>
    <text x="200" y="490" fill="#1a1a1c">37 words, each with a box. "32" at x=(327.9, 337.9). "6mm²/" at x=(668.6, 694.2).</text>

    <rect x="40" y="508" width="1240" height="30" rx="6" fill="#f4f0fa"/>
    <text x="58" y="528" fill="#6c3ca0" font-weight="700">2 · rule</text>
    <text x="200" y="528" fill="#1a1a1c">11 column edges from ruling lines: 54.5 · 98.5 · 137.2 · 178.2 · 255.5 · 308.7 · 356.2 · 436.0 · 655.0 · 821.7 · 976.3</text>

    <rect x="40" y="546" width="1240" height="30" rx="6" fill="#eef7f1"/>
    <text x="58" y="566" fill="#1b7a3e" font-weight="700">3 · bind</text>
    <text x="200" y="566" fill="#1a1a1c">"32" ∈ [308.7, 356.2] → CPD Size(A).  "6mm²/" ∈ [655.0, 821.7] → Conductor Size/Type.  Decided, before any meaning is applied.</text>

    <rect x="40" y="584" width="1240" height="30" rx="6" fill="#fdf7ee"/>
    <text x="58" y="604" fill="#b0700c" font-weight="700">4 · interpret</text>
    <text x="200" y="604" fill="#1a1a1c">device.rating_a = 32 A · device.class = MCB, curve C · cable.live_csa_mm2 = 6 · cable.cores = 5 · circuit occupies 3 ways (3PH)</text>

    <rect x="40" y="622" width="1240" height="30" rx="6" fill="#f3f3f6"/>
    <text x="58" y="642" fill="#4a4c54" font-weight="700">5 · reconcile</text>
    <text x="200" y="642" fill="#1a1a1c">board header says 6 ways; 4 populated + 2 spare = 6 ✓ · fed from DB-AL-MAIN on 35 mm² — check against the schematic</text>
  </g>

  <text x="40" y="700" font-size="15" fill="#c62828" font-weight="700">Skip to 4 and both "32" and "6" are just numbers in a string, and picking between them is a coin toss with a plausible-looking wrong answer.</text>
</svg>
